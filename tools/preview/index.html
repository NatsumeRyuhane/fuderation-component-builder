<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组件预览</title>
<link rel="stylesheet" href="/vendor-site-chat.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">组</span>
    <strong>组件预览</strong>
    <span class="brand-sub">本地渲染 · 使用官方运行时</span>
  </div>
  <div class="meta" data-meta>加载中…</div>
</header>

<div class="dropzone" data-dropzone hidden>
  <div class="dropzone-card">
    <div class="dropzone-icon">⤓</div>
    <div class="dropzone-title">松手即可载入组件</div>
    <div class="dropzone-hint">支持 component.json 导出文件</div>
  </div>
</div>

<main class="layout">

  <!-- ── 左：聊天预览 ─────────────────────────────────────── -->
  <section class="pane">
    <div class="pane-head">
      <h2>聊天气泡</h2>
      <div class="seg" role group>
        <button type="button" data-width="320">320<small>手机</small></button>
        <button type="button" data-width="360" class="active">360<small>默认</small></button>
        <button type="button" data-width="480">480<small>平板</small></button>
        <button type="button" data-width="680">680<small>桌面</small></button>
      </div>
    </div>

    <div class="chat-stage" data-stage>
      <div class="chat-message-row chat-msg-left">
        <div class="chat-msg-avatar-wrapper">
          <img class="chat-msg-avatar chat-msg-avatar-img" data-char-avatar alt="">
        </div>
        <div class="chat-bubble-wrap" data-bubble-wrap>
          <div class="chat-msg-author" data-char-name>角色</div>
          <div class="chat-msg-bubble" data-bubble></div>
        </div>
      </div>
    </div>

    <div class="md-notice" data-md-notice hidden>
      <strong>正文经过站点的消毒管线</strong>
      <span class="md-notice-body" data-md-notice-body></span>
      <span class="tip" title="气泡里显示的就是真实客户端会显示的内容——包括被删掉的部分。站点渲染聊天正文时会跑两道：先用一份宽松的 DOMPurify 配置（放行 onclick / onerror / ontoggle），再用正则把这些处理器重新剥掉，只保留站点自己的 12 个回调。这里只告诉你被拿掉了什么，不会替你补回去。">?</span>
    </div>

    <div class="composer">
      <div class="composer-label">
        聊天输入框
        <span class="tip" title="组件调用 fillInput() 时，文本会被写进这里，就像在真实客户端里一样。它不会发送任何东西——只是让你确认组件塞给玩家的内容。">?</span>
      </div>
      <div class="composer-box">
        <input type="text" data-chat-input placeholder="组件调用 fillInput() 时会写到这里">
        <button type="button" class="composer-send" disabled title="预览不会真的发送">↑</button>
      </div>
    </div>
  </section>

  <!-- ── 右：控制面板 ─────────────────────────────────────── -->
  <section class="pane pane-side">

    <h2>组件来源</h2>
    <div class="source-row">
      <span class="source-chip" data-source-chip>src/</span>
      <button type="button" class="btn" data-pick-file>载入 component.json…</button>
      <button type="button" class="btn ghost" data-reset-src hidden>回到 src/</button>
      <input type="file" accept="application/json,.json" data-file-input hidden>
    </div>
    <p class="hint">也可以直接把 <code>component.json</code> 拖进窗口任意位置。</p>
    <div class="source-row">
      <button type="button" class="btn" data-reload-component>重新加载组件</button>
      <button type="button" class="btn ghost" data-apply-changes>应用修改</button>
      <label class="raw-toggle"><input type="checkbox" data-auto-refresh checked> 自动刷新</label>
    </div>
    <p class="hint">重新加载会恢复默认参数并清空消息和调用记录。自动刷新在最后一次修改后等待 400 ms；关闭后点击「应用修改」。</p>

    <h2>参数</h2>
    <div class="params" data-params></div>

    <h2>
      消息内容
      <label class="raw-toggle"><input type="checkbox" data-raw-toggle> 直接编辑原文</label>
    </h2>

    <div data-composed>
      <label class="field">
        <span>组件前的正文<em>（Markdown）</em></span>
        <textarea data-before rows="3" spellcheck="false"></textarea>
      </label>
      <label class="field">
        <span>组件后的正文<em>（Markdown）</em></span>
        <textarea data-after rows="3" spellcheck="false"></textarea>
      </label>
    </div>

    <label class="field" data-raw-field hidden>
      <span>助手消息原文<em>（运行时实际解析的内容）</em></span>
      <textarea data-message rows="10" spellcheck="false"></textarea>
    </label>

    <h2>渲染模式</h2>
    <div class="mode" data-mode>…</div>
    <ul class="warnings" data-warnings></ul>

    <h2>注入的系统提示词</h2>
    <p class="hint">故事线实际告诉模型的内容。<code>ai_prompt</code> 为空时这里什么都没有。</p>
    <pre class="prompt" data-prompt></pre>

    <h2>
      宿主调用记录
      <button type="button" class="mini" data-clear-log>清空</button>
      <button type="button" class="mini" data-reset-storage>清除本地存储</button>
    </h2>
    <div class="log" data-log></div>
  </section>

</main>

<script type="module" src="/main.js"></script>
</body>
</html>
